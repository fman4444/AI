<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주 4.5일제 근무 현황 점검</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .summary { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  @media (max-width: 900px) { .summary { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 640px) { .summary { grid-template-columns: repeat(2, 1fr); } }
  .summary > div { background: var(--card); border-radius: var(--r-card); padding: var(--s3) var(--s3); }
  .summary .label { color: var(--muted); font-size: var(--fs-small); }
  .summary .value { font-size: var(--fs-num); font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .summary .value.date { font-size: 22px; }
  .summary .value { white-space: nowrap; }
  @media (max-width: 640px) { .summary .value { font-size: 24px; } .summary .value.date { font-size: 18px; } }
  /* LH 바로가기 카드처럼: 중요한 하나만 진한 파랑 */
  .go { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media (max-width: 640px) { .go { grid-template-columns: 1fr; } }
  .go a {
    display: flex; align-items: center; gap: var(--s4); padding: 28px var(--s4); border-radius: var(--r-card);
    text-decoration: none; background: var(--card-gray); color: var(--text); transition: transform .12s ease;
  }
  .go a:hover { transform: translateY(-2px); }
  .go a.main { background: var(--primary); color: var(--on-primary); box-shadow: 0 8px 20px rgba(47, 91, 193, .28); }
  .go .ico { flex: none; width: 84px; height: 84px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .go strong { display: block; font-size: var(--fs-card); font-weight: 800; margin-bottom: 4px; }
  .go a.main strong { text-decoration: underline; text-underline-offset: 4px; }
  .go span.desc { display: block; color: var(--muted); font-size: var(--fs-small); }
  .go a.main span.desc { color: #fff; }
  @media (max-width: 640px) { .go .ico { width: 64px; height: 64px; } .go .ico svg { width: 34px; height: 34px; } }
  .empty { color: var(--muted); margin: var(--s2) 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="title-row">
    <h1><span class="accent">주 4.5일제</span> 근무 현황 점검</h1>
    <span class="practice-tag">LH 실습용 · 가상 자료</span>
  </div>
  <p class="sub">가상 자료로만 시험합니다. 입력한 내용은 이 브라우저 안에만 저장되며 밖으로 보내지 않습니다.</p>

  <nav class="menu" aria-label="메뉴">
    <a href="index.html" aria-current="page">시작</a>
    <a href="pages/IN.html">근태 입력</a>
    <a href="pages/board.html">충족 현황</a>
  </nav>

  <div class="section">
    <h2><span class="accent">요약</span></h2>
    <div class="summary">
      <div><div class="label">대상 금요일</div><div class="value date" id="sumFriday">-</div></div>
      <div><div class="label">부서원(교육대상자)</div><div class="value" id="sumMembers">0명</div></div>
      <div><div class="label">이번 금요일 근태 입력</div><div class="value" id="sumAttendance">0건</div></div>
      <div><div class="label">미입력자</div><div class="value" id="sumMissing">0명</div></div>
      <div><div class="label">확인 필요</div><div class="value" id="sumFlags">0건</div></div>
    </div>
    <p class="empty" id="sumEmpty">아직 자료가 없습니다. 아래 '가져오기'나 '가상 표본 채우기'로 표본을 불러오십시오.</p>
  </div>

  <div class="go">
    <a href="pages/IN.html" class="main">
      <span class="ico" aria-hidden="true"><svg width="44" height="44" viewBox="0 0 44 44"><rect x="8" y="8" width="24" height="28" rx="4" fill="#fff"/><rect x="8" y="8" width="24" height="28" rx="4" fill="#2F5BC1" opacity=".18"/><path d="M14 17h12M14 23h12M14 29h7" stroke="#2F5BC1" stroke-width="3" stroke-linecap="round"/><path d="M30 34l8-8 3 3-8 8h-3z" fill="#FFE6A3" stroke="#24489A" stroke-width="1.5"/></svg></span>
      <span><strong>A. 근태 입력</strong><span class="desc">부서원이 금요일 부재 유형과 부재 시간을 입력</span></span>
    </a>
    <a href="pages/board.html">
      <span class="ico" aria-hidden="true"><svg width="44" height="44" viewBox="0 0 44 44"><rect x="7" y="22" width="7" height="14" rx="2" fill="#2F5BC1" opacity=".45"/><rect x="18.5" y="14" width="7" height="22" rx="2" fill="#2F5BC1"/><rect x="30" y="18" width="7" height="18" rx="2" fill="#2F5BC1" opacity=".7"/><path d="M5 20h34" stroke="#24489A" stroke-width="2" stroke-dasharray="3 3"/></svg></span>
      <span><strong>B. 충족 현황</strong><span class="desc">개인 달성·부서 충족·미입력자 확인</span></span>
    </a>
  </div>

  <div class="card">
    <h2>자료 관리</h2>
    <div class="row">
      <button type="button" class="primary" id="importBtn">가져오기 (표본·백업 JSON)</button>
      <button type="button" id="sampleBtn">가상 표본 채우기 (시연용)</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <button type="button" id="exportBtn">백업 내보내기</button>
      <button type="button" class="danger" id="clearBtn">비우기</button>
    </div>
    <div class="msg" id="manageMsg" role="status" aria-live="polite" hidden></div>
  </div>
</div>
<script src="assets/common.js"></script>
<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }

  function showMsg(text, kind) {
    var el = $('manageMsg');
    el.textContent = text;
    el.className = 'msg ' + kind;
    el.hidden = false;
  }

  /* 미입력자·확인 필요 수 — 충족 현황 페이지(board.js)와 같은 기준으로 센다 */
  function countChecks(d) {
    var types = ['없음', '휴가', '출장'];
    var seen = Object.create(null), list = [];
    d.members.forEach(function (m) {
      if (m && typeof m.id === 'string' && m.id !== '' && !seen[m.id]) { seen[m.id] = true; list.push(m); }
    });
    var byId = Object.create(null), flags = 0, missing = 0;
    d.attendance.forEach(function (a) {
      if (!a || a.date !== d.targetFriday) { return; }
      if (!seen[a.id]) { flags += 1; return; }            /* 명단에 없는 사번 */
      (byId[a.id] = byId[a.id] || []).push(a);
    });
    list.forEach(function (m) {
      if (m.trainee === true) { return; }                 /* 교육대상자는 평가 제외 */
      var recs = byId[m.id] || [];
      if (recs.length > 1) { flags += 1; return; }         /* 중복 입력 */
      if (recs.length === 0) { missing += 1; return; }     /* 미입력 */
      var r = recs[0];
      var ok = types.indexOf(r.absentType) >= 0 && typeof r.absentHours === 'number' &&
        isFinite(r.absentHours) && r.absentHours >= 0 && r.absentHours <= 8;
      if (!ok) { flags += 1; }                             /* 값 오류 */
    });
    return { missing: missing, flags: flags };
  }

  function renderSummary() {
    var d = loadData();
    var trainees = d.members.filter(function (m) { return m && m.trainee === true; }).length;
    var thisFriday = d.attendance.filter(function (a) { return a && a.date === d.targetFriday; }).length;
    $('sumFriday').textContent = d.targetFriday || '-';
    $('sumMembers').textContent = d.members.length + '명 (' + trainees + '명)';
    $('sumAttendance').textContent = thisFriday + '건';
    var c = countChecks(d);
    $('sumMissing').textContent = c.missing + '명';
    $('sumFlags').textContent = c.flags + '건';
    $('sumEmpty').hidden = d.members.length > 0;
    $('exportBtn').disabled = d.members.length === 0 && d.attendance.length === 0;
  }

  /* 가상 표본 채우기(시연용) — fetch를 쓸 수 없어 data/team_sample.json과 같은 내용을 여기 한 벌 둔다.
     표본 파일을 바꾸면 이 값도 함께 바꾼다(자동 시험으로 같은지 대조). */
  var SAMPLE = {"targetFriday":"2026-11-27","members":[{"id":"M01","dept":"가상1부","trainee":false},{"id":"M02","dept":"가상1부","trainee":false},{"id":"M03","dept":"가상1부","trainee":false},{"id":"M04","dept":"가상1부","trainee":false},{"id":"M05","dept":"가상1부","trainee":false},{"id":"M06","dept":"가상1부","trainee":true},{"id":"M07","dept":"가상2부","trainee":false},{"id":"M08","dept":"가상2부","trainee":false},{"id":"M09","dept":"가상2부","trainee":false},{"id":"M10","dept":"가상2부","trainee":false},{"id":"M11","dept":"가상2부","trainee":true},{"id":"M12","dept":"가상2부","trainee":true},{"id":"M13","dept":"가상3부","trainee":false},{"id":"M14","dept":"가상3부","trainee":false},{"id":"M15","dept":"가상3부","trainee":false},{"id":"M16","dept":"가상3부","trainee":false},{"id":"M17","dept":"가상3부","trainee":false},{"id":"M18","dept":"가상3부","trainee":false}],"attendance":[{"id":"M01","date":"2026-11-27","absentType":"휴가","absentHours":8},{"id":"M02","date":"2026-11-27","absentType":"출장","absentHours":4},{"id":"M03","date":"2026-11-27","absentType":"휴가","absentHours":3.5},{"id":"M04","date":"2026-11-27","absentType":"없음","absentHours":0},{"id":"M06","date":"2026-11-27","absentType":"없음","absentHours":0},{"id":"M07","date":"2026-11-27","absentType":"휴가","absentHours":4},{"id":"M08","date":"2026-11-27","absentType":"출장","absentHours":6},{"id":"M09","date":"2026-11-27","absentType":"없음","absentHours":0},{"id":"M11","date":"2026-11-27","absentType":"휴가","absentHours":8},{"id":"M13","date":"2026-11-27","absentType":"휴가","absentHours":8},{"id":"M14","date":"2026-11-27","absentType":"출장","absentHours":8},{"id":"M15","date":"2026-11-27","absentType":"휴가","absentHours":5},{"id":"M16","date":"2026-11-27","absentType":"없음","absentHours":0},{"id":"M17","date":"2026-11-27","absentType":"휴가","absentHours":4},{"id":"M17","date":"2026-11-27","absentType":"없음","absentHours":0},{"id":"M18","date":"2026-11-27","absentType":"휴가","absentHours":4}]};
  $('sampleBtn').addEventListener('click', function () {
    var d = loadData();
    if ((d.members.length > 0 || d.attendance.length > 0) &&
        !window.confirm('지금 자료를 지우고 가상 표본으로 바꾸시겠습니까?')) {
      showMsg('자료는 그대로입니다.', 'warn');
      return;
    }
    var copy = JSON.parse(JSON.stringify(SAMPLE));
    if (!saveData(copy)) { showMsg('이 브라우저에서는 저장할 수 없습니다.', 'error'); return; }
    showMsg('가상 표본을 채웠습니다. 부서원 ' + copy.members.length + '명, 근태 ' + copy.attendance.length + '건', 'ok');
    renderSummary();
  });

  $('importBtn').addEventListener('click', function () { $('importFile').click(); });
  $('importFile').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) { return; }
    importJson(file).then(function (r) {
      showMsg(r.message, r.ok ? 'ok' : 'error');
      renderSummary();
    });
  });
  $('exportBtn').addEventListener('click', function () {
    exportJson();
    showMsg('백업 파일(team2g_backup.json)을 내려받았습니다.', 'ok');
  });
  $('clearBtn').addEventListener('click', function () {
    if (!window.confirm('저장된 자료를 모두 지우시겠습니까? 필요하면 먼저 백업을 내보내십시오.')) { return; }
    clearData();
    showMsg('자료를 비웠습니다. 가져오기로 표본을 다시 불러올 수 있습니다.', 'ok');
    renderSummary();
  });

  renderSummary();
})();
</script>
</body>
</html>
