<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주 4.5일제 근무 현황 점검</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 640px) { .summary { grid-template-columns: 1fr; } }
  .summary .label { color: var(--muted); font-size: .85rem; }
  .summary .value { font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .go { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  @media (max-width: 640px) { .go { grid-template-columns: 1fr; } }
  .go a {
    display: block; padding: 16px; border-radius: 10px; text-decoration: none;
    background: var(--accent); color: var(--accent-text);
  }
  .go a strong { display: block; font-size: 1.1rem; }
  .go a span { font-size: .9rem; opacity: .9; }
  .empty { color: var(--muted); margin: 8px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>주 4.5일제 근무 현황 점검</h1>
  <p class="sub">가상 자료로만 시험합니다. 입력한 내용은 이 브라우저 안에만 저장되고 밖으로 보내지 않아요.</p>

  <nav class="menu" aria-label="메뉴">
    <a href="index.html" aria-current="page">시작</a>
    <a href="pages/IN.html">근태 입력</a>
    <a href="pages/board.html">충족 현황</a>
  </nav>

  <div class="card">
    <h2>요약</h2>
    <div class="summary">
      <div><div class="label">대상 금요일</div><div class="value" id="sumFriday">-</div></div>
      <div><div class="label">부서원 (교육대상자)</div><div class="value" id="sumMembers">0명</div></div>
      <div><div class="label">이번 금요일 근태 입력</div><div class="value" id="sumAttendance">0건</div></div>
    </div>
    <p class="empty" id="sumEmpty">아직 자료가 없어요. 아래 '가져오기'로 가상 표본(data/team_sample.json)을 불러오세요.</p>
  </div>

  <div class="go">
    <a href="pages/IN.html"><strong>A. 근태 입력 →</strong><span>부서원이 금요일 부재 유형과 부재 시간을 입력</span></a>
    <a href="pages/board.html"><strong>B. 충족 현황 →</strong><span>개인 달성·부서 충족·미입력자 확인</span></a>
  </div>

  <div class="card">
    <h2>자료 관리</h2>
    <div class="row">
      <button type="button" class="primary" id="importBtn">가져오기 (표본·백업 JSON)</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <button type="button" id="exportBtn">백업 내보내기</button>
      <button type="button" id="clearBtn">비우기</button>
    </div>
    <div class="msg" id="manageMsg" role="status" aria-live="polite" hidden></div>
  </div>
</div>
<script src="assets/common.js"></script>
<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }

  function showMsg(text, kind) {
    var el = $('manageMsg');
    el.textContent = text;
    el.className = 'msg ' + kind;
    el.hidden = false;
  }

  function renderSummary() {
    var d = loadData();
    var trainees = d.members.filter(function (m) { return m && m.trainee === true; }).length;
    var thisFriday = d.attendance.filter(function (a) { return a && a.date === d.targetFriday; }).length;
    $('sumFriday').textContent = d.targetFriday || '-';
    $('sumMembers').textContent = d.members.length + '명 (' + trainees + '명)';
    $('sumAttendance').textContent = thisFriday + '건';
    $('sumEmpty').hidden = d.members.length > 0;
    $('exportBtn').disabled = d.members.length === 0 && d.attendance.length === 0;
  }

  $('importBtn').addEventListener('click', function () { $('importFile').click(); });
  $('importFile').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) { return; }
    importJson(file).then(function (r) {
      showMsg(r.message, r.ok ? 'ok' : 'error');
      renderSummary();
    });
  });
  $('exportBtn').addEventListener('click', function () {
    exportJson();
    showMsg('백업 파일(team2g_backup.json)을 내려받았어요.', 'ok');
  });
  $('clearBtn').addEventListener('click', function () {
    if (!window.confirm('저장된 자료를 모두 지울까요? 필요하면 먼저 백업을 내보내세요.')) { return; }
    clearData();
    showMsg('비웠어요. 가져오기로 표본을 다시 불러올 수 있어요.', 'ok');
    renderSummary();
  });

  renderSummary();
})();
</script>
</body>
</html>
