<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>충족 현황 — 주 4.5일제 근무 현황 점검</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .rule { color: var(--muted); font-size: .88rem; margin: 0; padding-left: 18px; }
  .list { margin: 6px 0 0; padding-left: 18px; }
  .empty { color: var(--muted); }
  td .confirm { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>충족 현황</h1>
  <p class="sub">대상 금요일 근태를 평가기준에 따라 분류합니다. 모든 판정은 담당 검토 후 확정입니다.</p>

  <nav class="menu" aria-label="메뉴">
    <a href="../index.html">시작</a>
    <a href="IN.html">근태 입력</a>
    <a href="board.html" aria-current="page">충족 현황</a>
  </nav>

  <div class="msg warn" id="needData" hidden>시작 페이지에서 표본을 먼저 가져오세요. 부서원 명단이 있어야 판정할 수 있어요.</div>

  <div id="report" hidden>
    <div class="card">
      <h2>대상 금요일: <span id="targetFriday"></span></h2>
      <ul class="rule">
        <li>개인 달성: 금요일 8시간 중 휴가·출장 부재가 4시간 이상</li>
        <li>부서 충족: 평가대상자의 50% 이상이 개인 달성</li>
        <li>평가대상자: 부서원 중 교육대상자를 뺀 인원. 미입력자는 평가대상자에 넣고 달성으로 세지 않음</li>
      </ul>
    </div>

    <div class="card">
      <h2>부서별 충족 여부</h2>
      <div class="table-wrap"><table id="deptTable"></table></div>
    </div>

    <div class="card">
      <h2>미입력자 <span id="missingCount"></span></h2>
      <div id="missingList"></div>
    </div>

    <div class="card">
      <h2>확인 필요 <span id="flagCount"></span></h2>
      <div id="flagList"></div>
    </div>

    <div class="card">
      <h2>개인별 현황</h2>
      <div class="table-wrap"><table id="personTable"></table></div>
    </div>
  </div>
</div>
<script src="../assets/common.js"></script>
<script src="../assets/board.js"></script>
</body>
</html>
