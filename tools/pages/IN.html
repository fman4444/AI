<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>근태 입력 — 주 4.5일제 근무 현황 점검</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
  .form-grid label { display: block; font-weight: 600; margin-bottom: 4px; }
  .form-grid select, .form-grid input { width: 100%; }
  .hint { color: var(--muted); font-size: .85rem; margin: 8px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>근태 입력</h1>
  <p class="sub">대상 금요일의 부재 유형과 부재 시간을 입력합니다. 가상 자료만 넣으세요.</p>

  <nav class="menu" aria-label="메뉴">
    <a href="../index.html">시작</a>
    <a href="IN.html" aria-current="page">근태 입력</a>
    <a href="board.html">충족 현황</a>
  </nav>

  <div class="msg warn" id="needData" hidden>시작 페이지에서 표본을 먼저 가져오세요. 부서원 명단이 있어야 입력할 수 있어요.</div>

  <div class="card" id="formCard" hidden>
    <h2>대상 금요일: <span id="targetFriday"></span></h2>
    <div class="form-grid">
      <div>
        <label for="memberId">사번</label>
        <select id="memberId"></select>
      </div>
      <div>
        <label for="absentType">부재 유형</label>
        <select id="absentType">
          <option value="없음">없음</option>
          <option value="휴가">휴가</option>
          <option value="출장">출장</option>
        </select>
      </div>
      <div>
        <label for="absentHours">부재 시간 (0~8시간)</label>
        <input id="absentHours" type="number" min="0" max="8" step="0.5" value="0" inputmode="decimal">
      </div>
    </div>
    <p class="hint">반차는 휴가 4시간으로 입력하세요. 같은 사번을 다시 저장하면 기존 입력을 고쳐요.</p>
    <div class="row" style="margin-top:12px">
      <button type="button" class="primary" id="saveBtn">저장</button>
      <span class="confirm" id="savedCount"></span>
    </div>
    <div class="msg" id="result" role="status" aria-live="polite" hidden></div>
  </div>
</div>
<script src="../assets/common.js"></script>
<script src="../assets/IN.js"></script>
</body>
</html>
