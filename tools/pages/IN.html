<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>근태 입력 — 주 4.5일제 근무 현황 점검</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .form-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: var(--s3); }
  @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
  .form-grid label { display: block; margin-bottom: 6px; }
  .form-grid select, .form-grid input { width: 100%; }
  .hint { color: var(--muted); font-size: var(--fs-small); margin: var(--s2) 0 0; }
  .friday { display: inline-block; margin-left: 6px; }
  .count { color: var(--muted); font-size: var(--fs-small); }
  .check { display: inline-flex; align-items: center; gap: 8px; margin-top: var(--s3); cursor: pointer; }
  .check input { width: 20px; height: 20px; min-height: 0; }
  .hint-inline { color: var(--muted); font-weight: 400; font-size: var(--fs-small); }
</style>
</head>
<body>
<div class="wrap">
  <div class="title-row">
    <h1><span class="accent">근태</span> 입력</h1>
    <span class="practice-tag">LH 실습용 · 가상 자료</span>
  </div>
  <p class="sub">대상 금요일의 부재 유형과 부재 시간을 입력합니다. 가상 자료만 입력하십시오.</p>

  <nav class="menu" aria-label="메뉴">
    <a href="../index.html">시작</a>
    <a href="summary.html">요약</a>
    <a href="IN.html" aria-current="page">근태 입력</a>
    <a href="board.html">충족 현황</a>
    <a href="admin.html">자료관리(관리자용)</a>
  </nav>

  <div class="msg warn" id="needData" hidden>자료관리(관리자용) 탭에서 표본 자료를 먼저 가져오십시오. 부서원 명단이 있어야 입력할 수 있습니다.</div>

  <div class="section" id="formCard" hidden>
    <h2>대상 금요일 <span class="accent friday" id="targetFriday"></span></h2>
    <div class="card" style="margin-bottom:0">
      <div class="form-grid">
        <div>
          <label for="memberId">사번</label>
          <select id="memberId"></select>
        </div>
        <div>
          <label for="absentType">부재 유형</label>
          <select id="absentType">
            <option value="없음">없음</option>
            <option value="휴가">휴가</option>
            <option value="출장">출장</option>
          </select>
        </div>
        <div>
          <label for="absentHours">부재 시간 (0~8시간)</label>
          <input id="absentHours" type="number" min="0" max="8" step="0.5" value="0" inputmode="decimal">
        </div>
      </div>
      <label class="check" for="isTrainee"><input type="checkbox" id="isTrainee"> 교육대상자 <span class="hint-inline">— 체크하면 평가대상자(모수)에서 제외됩니다</span></label>
      <p class="hint">반차는 휴가 4시간으로 입력하십시오. 같은 사번을 다시 저장하면 기존 입력이 수정됩니다. 교육대상자는 부재가 없으면 '없음 · 0시간'으로 저장하십시오.</p>
      <div class="row" style="margin-top:var(--s3)">
        <button type="button" class="primary" id="saveBtn">저장</button>
        <span class="count" id="savedCount"></span>
      </div>
      <div class="msg" id="result" role="status" aria-live="polite" hidden></div>
    </div>
  </div>
</div>
<script src="../assets/common.js"></script>
<script src="../assets/IN.js"></script>
</body>
</html>
